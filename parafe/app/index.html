<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parafe · Démo de l'application</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="app.css">
</head>
<body class="app">

<div class="proto-banner">Maquette interactive · données d'exemple, rien n'est réellement envoyé</div>

<div class="shell">
  <aside class="side">
    <a class="brand" href="../" aria-label="Parafe, retour au site">Parafe</a>
    <nav aria-label="Application">
      <a class="navlink" data-route="documents" href="#/documents">Documents</a>
      <a class="navlink" data-route="nouveau" href="#/nouveau">Nouveau document</a>
      <a class="navlink" data-route="client" href="#/client">Vue du client</a>
    </nav>
    <p class="side-note">Essayez le parcours complet : créez un document, envoyez-le, puis signez à la place du client.</p>
  </aside>

  <main id="view" tabindex="-1"></main>
</div>

<nav class="tabbar" aria-label="Application (mobile)">
  <a class="navlink" data-route="documents" href="#/documents">Documents</a>
  <a class="navlink" data-route="nouveau" href="#/nouveau">Nouveau</a>
  <a class="navlink" data-route="client" href="#/client">Vue client</a>
</nav>

<div id="lea-root"></div>
<div id="sheet-root"></div>
<div id="toast" role="status" aria-live="polite"></div>

<noscript><p style="padding:24px">Cette démo a besoin de JavaScript pour fonctionner.</p></noscript>
<script src="app.js"></script>
</body>
</html>
